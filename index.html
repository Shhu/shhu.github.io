<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shhu</title>
<meta name="description" content="Les applications de Shhu : facteur, client mail, et Atelier, éditeur d'images.">
<style>
  :root { color-scheme: light dark; --bg: #f7f8f8; --card: #fff; --border: #e2e6e5; --text: #111615; --muted: #4b5654; --accent: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0b0c; --card: #141718; --border: #24292a; --text: #f2f5f4; --muted: #a9b3b1; --accent: #2dd4bf; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .apps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  a.app { display: block; padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.app:hover, a.app:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
  a.app b { display: block; font-size: 19px; margin-bottom: 4px; }
  a.app span { color: var(--muted); font-size: 15px; }
  a.app em { display: block; margin-top: 12px; color: var(--accent); font-style: normal; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Shhu</h1>
  <p class="lead">Des applications simples et rapides, qui gardent vos données chez vous.</p>
  <div class="apps">
    <a class="app" href="facteur/">
      <b>facteur</b>
      <span>Client mail rapide, hors ligne et respectueux de la vie privée.</span>
      <em>Découvrir facteur →</em>
    </a>
    <a class="app" href="atelier/">
      <b>Atelier</b>
      <span>Éditeur d'images léger et rapide : calques, réglages et sélection par IA locale.</span>
      <em>Découvrir Atelier →</em>
    </a>
  </div>
</main>
</body>
</html>
