name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The signed Flatpak repository, built and signed by flatpak/publish.sh on Yann's computer
      # (the key never comes here), served at flatpak/repo/.
      - name: Flatpak repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Failing here keeps the site as it is: deploying without the
          # repository would take it offline for every app.
          if view="$(gh release view flatpak-repo --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            for attempt in 1 2 3 4 5; do
              gh release download flatpak-repo --repo "$GITHUB_REPOSITORY" --pattern flatpak-repo.tar --dir "$RUNNER_TEMP" --clobber && break
              [ "$attempt" != 5 ] || exit 1
              sleep 20
            done
            # Only the repository: an archive member elsewhere could replace the .flatpakref
            # files, and the key they carry.
            if tar -tf "$RUNNER_TEMP/flatpak-repo.tar" | grep -qv '^repo/\|^repo$'; then
              echo "flatpak-repo.tar holds files outside repo/" >&2
              exit 1
            fi
            tar -C flatpak -xf "$RUNNER_TEMP/flatpak-repo.tar" repo
          elif grep -q "release not found" <<< "$view"; then
            echo "No Flatpak repository published yet."
          else
            echo "$view"
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
